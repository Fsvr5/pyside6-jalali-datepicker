[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-jalali-datepicker"
version = "0.4.0"
description = "Native Jalali (Solar Hijri) date and date-range widgets for PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
keywords = ["pyside6", "qt", "jalali", "persian", "datepicker", "solar-hijri"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
